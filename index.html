<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삼국지 영걸전 리메이크</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161a;
        color: #e6e6e6;
        font-family: "Malgun Gothic", system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: grid;
        place-items: center;
        height: 100%;
      }
      #boot-error {
        display: none;
        max-width: 60rem;
        padding: 1.5rem;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #ff9d9d;
      }
      /* 캔버스와 HUD를 같은 상자에 겹쳐 오버레이가 화면 밖으로 어긋나지 않게 한다(DES-06). */
      #screen {
        position: relative;
      }
      .hud {
        position: absolute;
        inset: 0;
        /* 오버레이가 캔버스 입력을 가리지 않게 한다. 눌러야 하는 메뉴만 되살린다. */
        pointer-events: none;
        font-size: 0.95rem;
      }
      .hud > * {
        position: absolute;
      }
      .hud [hidden] {
        display: none;
      }
      .hud-status,
      .hud-info,
      .hud-forecast {
        padding: 0.35rem 0.7rem;
        border-radius: 4px;
        background: rgba(10, 12, 16, 0.72);
      }
      .hud-status {
        top: 12px;
        left: 12px;
      }
      .hud-forecast:not(:empty) {
        top: 12px;
        right: 12px;
        color: #ffcc80;
      }
      .hud-info {
        left: 12px;
        bottom: 44px;
      }
      .hud-info:empty,
      .hud-forecast:empty {
        display: none;
      }
      .hud-info[data-side="enemy"] {
        color: #ef9a9a;
      }
      .hud-info[data-side="player"] {
        color: #9fd8f7;
      }
      .hud-help {
        left: 12px;
        bottom: 12px;
        font-size: 0.8rem;
        opacity: 0.55;
      }
      .hud-menu {
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: auto;
      }
      .hud-menu-item {
        min-width: 6rem;
        padding: 0.5rem 1rem;
        border: 1px solid #4a5568;
        border-radius: 4px;
        background: rgba(18, 22, 30, 0.92);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .hud-menu-item:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .hud-menu-item.is-cursor {
        border-color: #ffd54f;
      }
      /* 책략·아이템 목록. 행동 메뉴 왼쪽에 붙는다. */
      .hud-submenu {
        right: 8.5rem;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 60%;
        overflow-y: auto;
        pointer-events: auto;
      }
      .hud-submenu-title {
        padding: 0.25rem 0.5rem;
        opacity: 0.7;
        font-size: 0.85rem;
      }
      .hud-submenu-item {
        min-width: 8rem;
        padding: 0.4rem 0.75rem;
        border: 1px solid #4a5568;
        border-radius: 4px;
        background: rgba(18, 22, 30, 0.92);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .hud-submenu-item:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .hud-submenu-item.is-cursor {
        border-color: #ffd54f;
      }
      /* 대화·일기토 알림. 화면 위쪽 가운데에 한 줄로 띄운다. */
      .hud-banner {
        top: 3.5rem;
        left: 50%;
        transform: translateX(-50%);
        max-width: 80%;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        background: rgba(18, 22, 30, 0.92);
        text-align: center;
      }
      .hud-banner[hidden] {
        display: none;
      }
      .hud-result {
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 3.5rem;
        font-weight: bold;
        text-shadow: 0 2px 12px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"><pre id="boot-error"></pre></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
